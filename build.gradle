plugins {
    id 'java'
    id "xyz.wagyourtail.unimined" version "1.4.2-SNAPSHOT"
}

base {
    archivesName = project.archives_base_name
}
version = "${project.version}+mc${project.minecraft_version}"
group = project.maven_group

// this is just here so we can test the outputs easier and clean between tests
unimined.useGlobalCache = false

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "sponge"
        url = "https://repo.spongepowered.org/maven"
    }
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        intermediary()
        yarn(18)
    }

    ornitheFabric {
        loader project.loader_version
    }
}

dependencies {
    modImplementation unimined.osl(project.minecraft_version, project.osl_version)

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}